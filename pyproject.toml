[project]
name = "rhizonp-navigator"
version = "0.1.0"
description = "Evidence-grounded retrieval baseline for plant-microbe interactions and microbial natural products."
requires-python = ">=3.10"
dependencies = [
    "alembic==1.14.0",
    "faiss-cpu",
    "fastapi==0.115.6",
    "FlagEmbedding==1.3.4",
    "langchain==0.3.14",
    "langchain-community==0.3.14",
    "langchain-huggingface==0.1.2",
    "langchain-openai==0.2.14",
    "modelscope==1.22.1",
    "psycopg2-binary==2.9.9",
    "pydantic-settings==2.14.2",
    "sentence-transformers==3.2.0",
    "SQLAlchemy==2.0.35",
]

[project.optional-dependencies]
dev = [
    "httpx==0.27.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
check_untyped_defs = true
