services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rhizonp}
      POSTGRES_USER: ${POSTGRES_USER:-rhizonp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rhizonp_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rhizonp} -d ${POSTGRES_DB:-rhizonp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rhizonp}:${POSTGRES_PASSWORD:-rhizonp_dev}@postgres:5432/${POSTGRES_DB:-rhizonp}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-yangjhchs/acge_text_embedding}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      VECTOR_DB_PATH: ${VECTOR_DB_PATH:-/app/data/faiss_all_acge}
      PYTHONPATH: /app/src
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "pytest"]

volumes:
  postgres_data:
