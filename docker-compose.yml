services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rhizonp}
      POSTGRES_USER: ${POSTGRES_USER:-rhizonp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rhizonp_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rhizonp} -d ${POSTGRES_DB:-rhizonp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rhizonp}:${POSTGRES_PASSWORD:-rhizonp_dev}@postgres:5432/${POSTGRES_DB:-rhizonp}
      PYTHONPATH: /app/src
      RHIZONP_RUNTIME_MODE: prod
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && python -m scripts.load_demo_fixtures && python -m scripts.load_literature_fixtures",
      ]
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rhizonp}:${POSTGRES_PASSWORD:-rhizonp_dev}@postgres:5432/${POSTGRES_DB:-rhizonp}
      PYTHONPATH: /app/src
      RHIZONP_RUNTIME_MODE: prod
    ports:
      - "${RHIZONP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "${RHIZONP_FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  app:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rhizonp}:${POSTGRES_PASSWORD:-rhizonp_dev}@postgres:5432/${POSTGRES_DB:-rhizonp}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-aspire/acge_text_embedding}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      VECTOR_DB_PATH: ${VECTOR_DB_PATH:-/app/data/faiss_all_acge}
      PYTHONPATH: /app/src
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - test
    command: ["python", "-m", "pytest"]

volumes:
  postgres_data:
