name: CI

on:
  push:
  pull_request:

jobs:
  phase-0-1-checks:
    name: Phase 0/1 checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Phase 0/1 check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "alembic==1.14.0" "fastapi==0.115.6" "httpx==0.27.2" "SQLAlchemy==2.0.35" "pydantic-settings==2.14.2" "pytest>=8.0" "ruff>=0.6" "mypy>=1.10"

      - name: Secret scan
        run: python -m scripts.check_no_secrets

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Test
        run: python -m pytest
